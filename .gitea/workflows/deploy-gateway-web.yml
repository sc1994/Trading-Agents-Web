name: Manually release private gateway workbench

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main SHA explicitly approved for this release
        required: true
        type: string
      private_ingress_verified_sha:
        description: Repeat the release SHA only after verifying all ingress is private and recording evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trading-agents-web-gateway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ (github.server_url == 'http://suncheng.online:14200' ||
      github.server_url == 'http://192.168.31.2:14200') &&
      github.repository == 'suncheng/Trading-Agents-Web' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: gateway
    steps:
      - name: Check out the synchronized commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build, deploy, and verify
        env:
          DEPLOY_SHA: ${{ github.sha }}
          MANUAL_RELEASE_SHA: ${{ github.event.inputs.release_sha }}
          PRIVATE_INGRESS_VERIFIED_SHA: ${{ github.event.inputs.private_ingress_verified_sha }}
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#DEPLOY_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          bash scripts/deploy_gateway_web.sh "$DEPLOY_SHA"
