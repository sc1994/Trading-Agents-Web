services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: trading-agents-web-ui:local
    ports:
      - "127.0.0.1:${TRADINGAGENTS_WEB_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 2s
